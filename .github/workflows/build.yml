name: Build

# Qt 6.11+ uses a per-architecture online repository layout that the aqtinstall
# version pinned by install-qt-action@v4 cannot read, so use the newest release
# that is still installable (6.10.3).
env:
  QT_VERSION: '6.10.3'

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (semver, e.g. 0.2.0). Defaults to the CMake project version.'
        required: false
        type: string
      draft:
        description: 'Create the GitHub release as a draft.'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  windows:
    name: Windows package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = ''
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } elseif ('${{ github.event.inputs.version }}') {
            $version = '${{ github.event.inputs.version }}'
          } else {
            $match = Select-String -Path CMakeLists.txt -Pattern 'VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)' |
              Select-Object -First 1
            if ($match) { $version = $match.Matches[0].Groups[1].Value }
          }
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Version '$version' is not a valid semantic version."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building QtThermal $version"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: >
          cmake -S . -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/dist"
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          -DQTTHERMAL_WARNINGS_AS_ERRORS=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install (windeployqt)
        run: cmake --install build

      - name: Create portable package
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $root = "package/QtThermal-$version"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item -Path 'dist/*' -Destination $root -Recurse -Force
          Compress-Archive -Path $root -DestinationPath "QtThermal-$version-win64.zip" -Force

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe'
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest -Uri $url -OutFile $installer
          Start-Process -FilePath $installer -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-'

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.version }}" 'installer\QtThermal.iss'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QtThermal-${{ steps.version.outputs.version }}
          if-no-files-found: error
          path: |
            QtThermal-*-win64.zip
            installer/Output/*-setup.exe

      - name: Create release
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: QtThermal ${{ steps.version.outputs.version }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          generate_release_notes: true
          files: |
            QtThermal-${{ steps.version.outputs.version }}-win64.zip
            installer/Output/QtThermal-${{ steps.version.outputs.version }}-setup.exe
